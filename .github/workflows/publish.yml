name: 맨티스 자동 발행

on:
  schedule:
    # 매일 한국시간 저녁 7시 무렵 (UTC 10:00). 아래에서 0~25분 랜덤 지연을 줘서 매일 시간이 조금씩 달라짐
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 토큰 확인 / preview = 다음 게시물 미리보기 / publish = 지금 발행"
        required: true
        default: check
        type: choice
        options: [check, preview, publish]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow google-api-python-client google-auth
      - name: ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: 랜덤 지연 (자동 발행일 때만)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1500 ))
      - name: 실행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python publisher/publish.py ${{ github.event.inputs.mode || 'publish' }}
