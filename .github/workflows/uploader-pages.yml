name: 업로드 툴 배포 (웹페이지)

# uploader/ 폴더를 GitHub Pages 로 올린다 → https://bethementis.github.io/mentis-publisher/
on:
  push:
    branches: [main]
    paths: ["uploader/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uploader
      - id: deploy
        uses: actions/deploy-pages@v4
